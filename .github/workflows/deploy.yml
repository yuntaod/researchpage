name: deploy

# This branch (barron-style) deploys its built site to the `barron-pages`
# branch. master/main keep their own workflow copy deploying to `gh-pages`.
# GitHub Pages serves whichever branch is selected in Settings -> Pages.

on:
  push:
    branches:
      - barron-style
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.1'
          bundler-cache: true
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
      - name: Build 🔧
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Deploy to barron-pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: barron-pages
