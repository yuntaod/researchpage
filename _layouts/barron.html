<!DOCTYPE HTML>
<html lang="en">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} - {% endif %}{{ site.first_name }} {{ site.last_name }}</title>
  <meta name="author" content="{{ site.first_name }} {{ site.last_name }}">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% include barron_metadata.html %}
  <link rel="shortcut icon" href="{{ '/assets/img/favicon-32x32.png' | relative_url }}" type="image/png">
  <link rel="stylesheet" type="text/css" href="{{ '/assets/css/barron.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  {% if site.enable_google_analytics and site.google_analytics %}
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ site.google_analytics }}');
  </script>
  {% endif %}
</head>

<body>
  <table class="page-table page-table--narrow">
    <tbody>
      <tr class="page-row">
        <td class="page-cell">

          {% include barron_header.html %}

          {{ content }}

        </td>
      </tr>
    </tbody>
  </table>

  <script type="text/javascript">
    function toggleNews() {
      var hidden = document.getElementById('hidden-news');
      var toggle = document.querySelector('.news-toggle');
      if (hidden.classList.contains('is-hidden')) {
        hidden.classList.remove('is-hidden');
        toggle.textContent = 'Show less news';
      } else {
        hidden.classList.add('is-hidden');
        toggle.textContent = 'Show more news';
      }
    }
  </script>
</body>

</html>
